# Quality gates, then the Android APK.
#   checks      — type-check, unit tests (Vitest), web build
#   e2e         — Playwright on Chromium (Android WebView engine) device profiles: blocking
#   e2e-cross   — Playwright on WebKit (iOS engine) and Firefox: reported, never delays a release
#   build       — APK; when package.json has a new version, publishes Release "vX.Y.Z"
#   device-tests — smoke tests of the APK on Android emulators (API 31/34/36, small phone, tablet)
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (app + e2e)
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Web build
        run: npm run build

  # Chromium = the Android WebView engine. Gates the APK release.
  e2e:
    name: E2E (chromium · Android profiles)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test --project=android-pixel-7 --project=android-galaxy-s9 --project=android-small-360 --project=android-tablet --project=android-landscape --project=desktop-chrome
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chromium
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  # WebKit (iOS engine) and Firefox: reported only, never delay an Android release.
  e2e-cross:
    name: E2E (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    # the official image ships every browser with its system libraries — `playwright install
    # --with-deps webkit` hung for 25 min on the runner in v0.3.0's CI run
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            projects: --project=iphone-se --project=iphone-15-pro-max --project=ipad-mini --project=desktop-safari
          - engine: firefox
            projects: --project=desktop-firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright
        # no retries here: a failing engine should report quickly instead of retrying 60 s timeouts
        run: npx playwright test ${{ matrix.projects }} --retries=0 --max-failures=15
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version
        id: v
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.PES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pes-release.jks"
            echo "PES_KEYSTORE_PATH=$RUNNER_TEMP/pes-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set — APK is signed with a throwaway debug key and cannot update an installed release build."
          fi

      - name: Build APK
        working-directory: android
        env:
          PES_VERSION_NAME: ${{ steps.v.outputs.name }}
          PES_VERSION_CODE: ${{ steps.v.outputs.code }}
          PES_KEYSTORE_PASSWORD: ${{ secrets.PES_KEYSTORE_PASSWORD }}
          PES_KEY_ALIAS: ${{ secrets.PES_KEY_ALIAS }}
          PES_KEY_PASSWORD: ${{ secrets.PES_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "PES-${{ steps.v.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PES-${{ steps.v.outputs.name }}-build${{ steps.v.outputs.code }}
          path: PES-*.apk
          retention-days: 14

      - name: Release skipped
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PES_KEYSTORE_PATH == ''
        run: echo "::warning::No release published — add the four PES_* signing secrets, then run this workflow again (Actions → Android → Run workflow)."

      # Only release-key builds are published, so installed apps can always update.
      - name: Publish release (new versions only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PES_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — only the build artifact was updated."
          else
            node tools/release-notes.mjs "${{ steps.v.outputs.name }}" > notes.md
            gh release create "$TAG" "PES-${{ steps.v.outputs.name }}.apk" --title "PES $TAG" --notes-file notes.md
          fi

  device-tests:
    name: Device smoke (API ${{ matrix.api-level }}, ${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking until the suite has proven stable
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 31's stock WebView is Chrome 91, below our minimum (94); real phones get updates from Play
          - { api-level: 33, profile: pixel_6, device: pixel6 }
          - { api-level: 34, profile: pixel_6, device: pixel6 }
          - { api-level: 36, profile: pixel_6, device: pixel6 }
          - { api-level: 34, profile: "Nexus 5", device: nexus5 }     # small phone, 360x640 dp
          - { api-level: 34, profile: "Nexus 10", device: nexus10 }   # tablet
    env:
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The build job names its artifact PES-<version>-build<code>, so match it by pattern.
      - name: Download APK from the build job
        uses: actions/download-artifact@v4
        with:
          pattern: PES-*
          merge-multiple: true

      - name: Check APK
        run: ls -l PES-*.apk

      # AVD cache as in the android-emulator-runner README, split into restore/save so the
      # snapshot is saved right after it is created (also when the smoke test later fails).
      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-${{ matrix.device }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          # -no-snapshot-save: never write the app or its data back into the cached snapshot
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The runner executes `script` line by line with sh, so it must stay one line.
          script: bash scripts/android-smoke.sh "$(ls PES-*.apk | head -1)" device-results

      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-results-api${{ matrix.api-level }}-${{ matrix.device }}
          path: device-results
          if-no-files-found: warn
          retention-days: 14
