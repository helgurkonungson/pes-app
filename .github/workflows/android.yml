# Quality gates, then the Android APK. Every gate blocks the release (ADR-020).
#   checks       — type-check, unit tests (Vitest), web build
#   e2e          — Playwright on Chromium (Android WebView engine) device profiles, 3 shards
#   e2e-cross    — Playwright on WebKit (iOS engine) and Firefox
#   build        — signed build for the store of this branch (store branches and manual runs only)
#   device-tests — smoke tests of that APK on Android emulators (API 33/34/36, small phone, tablet)
#   release      — when package.json has a new version and every gate passed: a GitHub Release
#                  with Russian + English notes (tools/release-notes.mjs)
#
# Branches (docs/BRANCHES.md):
#   main         — development; gates only (no build, saves Actions minutes in the private repo)
#   google-play  — Release "vX.Y.Z": PES-x.y.z.apk + Chompbook-x.y.z-play.aab (the Play upload)
#   galaxy-store — Release "galaxy-vX.Y.Z": Chompbook-x.y.z-galaxy.apk (Seller Portal → Binary)
#   rustore      — Release "rustore-vX.Y.Z": Chompbook-x.y.z-rustore.apk (RuStore Console → upload), ADR-042
name: Android

on:
  push:
    branches: [main, google-play, galaxy-store, rustore]
    # a push that only changes the website doesn't rebuild the app (site.yml checks it instead)
    paths-ignore: ["site/**"]
  pull_request:
    paths-ignore: ["site/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # the store this branch builds for (ADR-041); main and PRs only run the gates
  STORE: ${{ github.ref_name == 'galaxy-store' && 'galaxy' || github.ref_name == 'rustore' && 'rustore' || 'play' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (app + e2e)
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Web build
        run: npm run build

  # Chromium = the Android WebView engine. Gates the APK release.
  # Split into 3 parallel shards (0.17.0: one job no longer fit in 30 minutes).
  e2e:
    name: E2E (chromium · Android profiles ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # the official image ships Chromium with its system libraries: `playwright install --with-deps`
    # needs apt mirrors, and their DNS failure on 11.11.2026 failed the whole run
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright
        run: npx playwright test --project=android-pixel-7 --project=android-galaxy-s9 --project=android-small-360 --project=android-tablet --project=android-landscape --project=desktop-chrome --shard=${{ matrix.shard }}/3
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  # WebKit (iOS engine) and Firefox: blocking since 0.9.0 (green on every run since 0.4).
  e2e-cross:
    name: E2E (${{ matrix.engine }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # the official image ships every browser with its system libraries — `playwright install
    # --with-deps webkit` hung for 25 min on the runner in v0.3.0's CI run
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # WebKit runs 4 profiles; in one job it outgrew the 25-minute limit (Nov 2026), so it's split in two
        include:
          - engine: webkit
            shard: 1/2
            projects: --project=iphone-se --project=iphone-15-pro-max --project=ipad-mini --project=desktop-safari
          - engine: webkit
            shard: 2/2
            projects: --project=iphone-se --project=iphone-15-pro-max --project=ipad-mini --project=desktop-safari
          - engine: firefox
            shard: 1/1
            projects: --project=desktop-firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright
        # one retry for a flaky test; --max-failures stops a broken engine early
        run: npx playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }} --retries=1 --max-failures=15
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.engine }}-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: [checks, e2e]
    # store branches and manual runs; main and pull requests stop after the gates
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # play | galaxy | rustore (src/build.ts, ADR-041, ADR-042)
          VITE_STORE: ${{ env.STORE }}
          # Google OAuth client ids for the one-tap free Gemini key (docs/GEMINI_SETUP.md); not secrets.
          # Empty = the app falls back to the in-app Google AI Studio page. Not in the RuStore build:
          # Gemini isn't offered in Russia and Belarus (ADR-042).
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ env.STORE != 'rustore' && vars.GOOGLE_WEB_CLIENT_ID || '' }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ env.STORE != 'rustore' && vars.GOOGLE_IOS_CLIENT_ID || '' }}
          # "Report this lesson" (ADR-025): HTTPS endpoint receiving JSON reports, and the e-mail for
          # reports shared by hand. Not secrets; empty = reports are shared through the share sheet.
          # The RuStore build shares by hand: its documents (152-FZ) ask for a consent before we receive any.
          VITE_REPORT_URL: ${{ env.STORE != 'rustore' && vars.REPORT_URL || '' }}
          VITE_REPORT_EMAIL: ${{ vars.REPORT_EMAIL }}
          # Chompbook Pro (ADR-037): RevenueCat public SDK key (public by design; empty = Pro can't be
          # bought in this build) and, optionally, another Chompbook AI server URL.
          VITE_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
          # Galaxy Store build: its RevenueCat key; GALAXY_BILLING=test = Samsung IAP test mode
          # (leave empty for builds sent to Samsung)
          VITE_REVENUECAT_GALAXY_KEY: ${{ vars.REVENUECAT_GALAXY_KEY }}
          VITE_GALAXY_BILLING: ${{ vars.GALAXY_BILLING }}
          # RuStore build: the app id from RuStore Console turns on Pro through RuStore Pay (ADR-042)
          VITE_RUSTORE_APP_ID: ${{ vars.RUSTORE_APP_ID }}
          VITE_PRO_API: ${{ vars.PRO_API }}

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version
        id: v
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.PES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pes-release.jks"
            echo "PES_KEYSTORE_PATH=$RUNNER_TEMP/pes-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set — APK is signed with a throwaway debug key and cannot update an installed release build."
          fi

      - name: Build APK
        working-directory: android
        env:
          PES_VERSION_NAME: ${{ steps.v.outputs.name }}
          PES_VERSION_CODE: ${{ steps.v.outputs.code }}
          PES_KEYSTORE_PASSWORD: ${{ secrets.PES_KEYSTORE_PASSWORD }}
          PES_KEY_ALIAS: ${{ secrets.PES_KEY_ALIAS }}
          PES_KEY_PASSWORD: ${{ secrets.PES_KEY_PASSWORD }}
          RUSTORE_APP_ID: ${{ vars.RUSTORE_APP_ID }}
        run: |
          chmod +x gradlew
          if [ "$STORE" = rustore ]; then
            # the `rustore` flavor (ADR-042): an APK signed with the same key, RuStore Pay inside
            ./gradlew assembleRustoreRelease --no-daemon --stacktrace
          elif [ "$STORE" = galaxy ]; then
            # the `galaxy` flavor (ADR-041): an APK signed with the same key
            ./gradlew assembleGalaxyRelease --no-daemon --stacktrace
          else
            # APK for direct install and the emulator smoke tests; AAB for Google Play (ADR-034)
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          fi

      # out/ = the release assets of this store (dist/ is the web build); smoke/ = the APK the emulators install
      - name: Collect the build
        env:
          V: ${{ steps.v.outputs.name }}
        run: |
          mkdir -p out smoke
          out=android/app/build/outputs
          if [ "$STORE" = rustore ]; then
            cp $out/apk/rustore/release/app-rustore-release.apk "out/Chompbook-$V-rustore.apk"
          elif [ "$STORE" = galaxy ]; then
            cp $out/apk/galaxy/release/app-galaxy-release.apk "out/Chompbook-$V-galaxy.apk"
          else
            cp $out/apk/release/app-release.apk "out/PES-$V.apk"
            # the Google Play upload: signed with the upload key (Play App Signing re-signs it)
            cp $out/bundle/release/app-release.aab "out/Chompbook-$V-play.aab"
          fi
          cp "$(ls out/*.apk | head -1)" smoke/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Chompbook-${{ env.STORE }}-${{ steps.v.outputs.name }}-build${{ steps.v.outputs.code }}
          path: out/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: smoke/*.apk
          retention-days: 3

      - name: Signed?
        id: signed
        run: echo "ok=${{ env.PES_KEYSTORE_PATH != '' }}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.v.outputs.name }}
      signed: ${{ steps.signed.outputs.ok }}

  device-tests:
    name: Device smoke (API ${{ matrix.api-level }}, ${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 31's stock WebView is Chrome 91, below our minimum (94); real phones get updates from Play
          - { api-level: 33, profile: pixel_6, device: pixel6 }
          - { api-level: 34, profile: pixel_6, device: pixel6 }
          - { api-level: 36, profile: pixel_6, device: pixel6 }
          - { api-level: 34, profile: "Nexus 5", device: nexus5 }     # small phone, 360x640 dp
          - { api-level: 34, profile: "Nexus 10", device: nexus10 }   # tablet
    env:
      AVD_TARGET: google_apis
      AVD_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: smoke-apk

      - name: Check APK
        run: ls -l *.apk

      # AVD cache as in the android-emulator-runner README, split into restore/save so the
      # snapshot is saved right after it is created (also when the smoke test later fails).
      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-${{ matrix.device }}-${{ env.AVD_TARGET }}-${{ env.AVD_ARCH }}

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.AVD_ARCH }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          # -no-snapshot-save: never write the app or its data back into the cached snapshot
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The runner executes `script` line by line with sh, so it must stay one line.
          # One retry on a fresh app install: emulators occasionally hang in system UI, not in the app.
          script: bash scripts/android-smoke.sh "$(ls *.apk | head -1)" device-results || bash scripts/android-smoke.sh "$(ls *.apk | head -1)" device-results/retry

      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-results-api${{ matrix.api-level }}-${{ matrix.device }}
          path: device-results
          if-no-files-found: warn
          retention-days: 14

  # Publishes only release-key builds, and only after every gate passed, so installed apps can always update.
  release:
    needs: [build, e2e-cross, device-tests]
    # store branches only: a manual run on main builds, but never publishes
    if: github.event_name != 'pull_request' && (github.ref_name == 'google-play' || github.ref_name == 'galaxy-store' || github.ref_name == 'rustore')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Release skipped
        if: needs.build.outputs.signed != 'true'
        run: echo "::warning::No release published — add the four PES_* signing secrets, then run this workflow again (Actions → Android → Run workflow)."

      - uses: actions/download-artifact@v4
        if: needs.build.outputs.signed == 'true'
        with:
          pattern: Chompbook-${{ env.STORE }}-*
          path: out
          merge-multiple: true

      - name: Publish release (new versions only)
        if: needs.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$STORE" = rustore ]; then TAG="rustore-v$VERSION"; TITLE="Chompbook $VERSION (RuStore)"
          elif [ "$STORE" = galaxy ]; then TAG="galaxy-v$VERSION"; TITLE="Chompbook $VERSION (Galaxy Store)"
          else TAG="v$VERSION"; TITLE="Chompbook v$VERSION"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — only the build artifact was updated."
          else
            node tools/release-notes.mjs "$VERSION" > notes.md
            # --target: the tag points at this store branch, not at main
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
          fi
