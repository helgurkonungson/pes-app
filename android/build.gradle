// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // the app module's Kotlin (RuStore Pay plugin, ADR-042); the same version Capacitor's plugins use
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // RuStore SDK (rustore flavor, ADR-042): the current host and the older one it moved from
        maven { url "https://nexus-external.rustore.ru/repository/maven-rustore-exposed/" }
        maven { url "https://artifactory-external.vkpartner.ru/artifactory/maven-rustore-exposed/" }
        maven { url "https://artifactory-external.vkpartner.ru/artifactory/maven/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
