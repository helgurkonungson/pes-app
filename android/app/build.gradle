apply plugin: 'com.android.application'
// Kotlin for the RuStore Pay plugin (rustore flavor, ADR-042): the RuStore SDK is Kotlin-first
apply plugin: 'org.jetbrains.kotlin.android'

def pesPackageVersion() {
    def pkg = new groovy.json.JsonSlurper().parse(file("../../package.json"))
    return pkg.version as String
}

android {
    namespace = "io.github.helgurkonungson.pes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // ADR-034: the Google Play id. The Java package / namespace stay io.github.helgurkonungson.pes (code only, not user-visible).
        applicationId "online.chompbook.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes these; local builds fall back to 1 / package.json version
        versionCode((System.getenv("PES_VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("PES_VERSION_NAME") ?: pesPackageVersion())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Release signing comes from environment variables (GitHub Actions secrets).
            // Without them the release build is signed with the debug key.
            def ks = System.getenv("PES_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("PES_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PES_KEY_ALIAS")
                keyPassword System.getenv("PES_KEY_PASSWORD")
            }
        }
    }
    // ADR-041: one app, a build per store. Same application id, version and signing key; the web
    // layer is built with VITE_STORE=<flavor> before `cap copy` (see .github/workflows/android.yml).
    flavorDimensions = ["store"]
    productFlavors {
        play {
            dimension "store"
        }
        galaxy {
            dimension "store"
        }
        // RuStore (ADR-042): RuStore Pay for Pro. RUSTORE_APP_ID = the app id from RuStore Console
        // (digits in console.rustore.ru/apps/<id>); the SDK reads it from the manifest as a string.
        rustore {
            dimension "store"
            resValue "string", "rustore_console_app_id", (System.getenv("RUSTORE_APP_ID") ?: "")
        }
    }
    buildTypes {
        release {
            signingConfig = System.getenv("PES_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
            // R8 shrinks the native layer (AndroidX, Kotlin, Play services): a smaller APK and
            // store download. Plugin classes are kept in proguard-rules.pro (Capacitor uses reflection).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Google Play In-App Review (StoreReviewPlugin, 0.19.2) — Play build only (ADR-041)
    playImplementation "com.google.android.play:review:2.0.2"
    // Samsung IAP for RevenueCat (GalaxyPurchasesPlugin, ADR-041). Must be the same version as the
    // native `purchases` SDK that @revenuecat/purchases-capacitor brings in through
    // purchases-hybrid-common (19.15.0 → 10.29.0); src/config.test.ts checks the pair.
    // `purchases` itself is only a private dependency of the Capacitor plugin, so the app declares it to compile against it.
    galaxyImplementation "com.revenuecat.purchases:purchases:10.29.0"
    galaxyImplementation "com.revenuecat.purchases:purchases-store-galaxy:10.29.0"
    // RuStore Pay SDK (RuStorePayPlugin, ADR-042), RuStore build only
    rustoreImplementation platform("ru.rustore.sdk:bom:2026.08.01")
    rustoreImplementation "ru.rustore.sdk:pay"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
